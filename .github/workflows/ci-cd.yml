name: Demo AI Application Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-monitoring-app:${{ github.sha }} .

          docker tag ${{ secrets.DOCKER_USERNAME }}/ai-monitoring-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/ai-monitoring-app:latest

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-monitoring-app:${{ github.sha }}

          docker push ${{ secrets.DOCKER_USERNAME }}/ai-monitoring-app:latest

      - name: Deploy Monitoring Stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |

            docker network create monitoring-network || true

            docker pull ${{ secrets.DOCKER_USERNAME }}/ai-monitoring-app:latest

            docker stop ai-app metrics prometheus grafana || true

            docker rm ai-app metrics prometheus grafana || true

            docker run -d \
              --name ai-app \
              --network monitoring-network \
              -p 8501:8501 \
              --restart always \
              -e APP_USERNAME=${{ secrets.APP_USERNAME }} \
              -e APP_PASSWORD=${{ secrets.APP_PASSWORD }} \
              -e APP_ENV=production \
              ${{ secrets.DOCKER_USERNAME }}/ai-monitoring-app:latest

            docker run -d \
              --name metrics \
              --network monitoring-network \
              -p 5001:5001 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/ai-monitoring-app:latest \
              python metrics.py

            docker run -d \
              --name prometheus \
              --network monitoring-network \
              -p 9090:9090 \
              --restart always \
              prom/prometheus

            docker run -d \
              --name grafana \
              --network monitoring-network \
              -p 3000:3000 \
              --restart always \
              grafana/grafana

            docker ps
