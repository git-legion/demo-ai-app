name: llamaops-ai Pipeline

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      deploy_ollama:
        description: "Deploy Ollama Runtime"
        required: true
        default: "false"
      deploy_observability:
        description: "Deploy OTel Collector + Tempo (first-time setup or config change)"
        required: true
        default: "false"

#################################################
# Global Environment Variables
#################################################

env:
  AI_IMAGE: llamaops-ai-web
  METRICS_IMAGE: llamaops-ai-metrics
  GRAFANA_IMAGE: llamaops-ai-grafana-monitoring
  PROMETHEUS_IMAGE: llamaops-ai-prometheus-server

jobs:

#################################################
# Detect Changed Files
#################################################

  detect-changes:

    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      metrics: ${{ steps.filter.outputs.metrics }}
      grafana: ${{ steps.filter.outputs.grafana }}
      prometheus: ${{ steps.filter.outputs.prometheus }}
      workflow: ${{ steps.filter.outputs.workflow }}

    steps:

      #################################################
      # Checkout Repository
      #################################################

      - name: Checkout Source Code
        uses: actions/checkout@v4

      #################################################
      # Detect Changed Files
      #################################################

      - name: Detect Changed Files
        id: filter
        uses: dorny/paths-filter@v3

        with:
          filters: |

            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

            metrics:
              - 'metrics/**'
              - '.github/workflows/**'

            grafana:
              - 'grafana/**'
              - '.github/workflows/**'

            prometheus:
              - 'prometheus/**'
              - '.github/workflows/**'

            workflow:
              - '.github/workflows/**'

#################################################
# Build And Deploy Frontend AI Application
#################################################

  deploy-frontend:

    name: Build And Deploy AI Frontend

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    steps:

      #################################################
      # Checkout Source Code
      #################################################

      - name: Checkout Source Code
        uses: actions/checkout@v4

      #################################################
      # SonarQube Scan
      #################################################

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      #################################################
      # Docker Login
      #################################################

      - name: Login To Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #################################################
      # Build Frontend Image
      #################################################

      - name: Build Frontend Image

        run: |

          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:latest \
            ./frontend

      #################################################
      # Trivy Security Scan
      #################################################

      - name: Trivy Security Scan

        uses: aquasecurity/trivy-action@master

        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      #################################################
      # Push Frontend Image
      #################################################

      - name: Push Frontend Image

        run: |

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:latest

      #################################################
      # Deploy Frontend Container
      #################################################

      - name: Deploy Frontend Container

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            #################################################
            # Create Network
            #################################################

            docker network create monitoring-network || true

            #################################################
            # Pull Latest Frontend Image
            #################################################

            docker pull \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:latest

            #################################################
            # Stop Existing Frontend Container
            #################################################

            docker stop llamaops-ai-web || true

            docker rm llamaops-ai-web || true

            #################################################
            # Deploy Frontend Container
            #################################################

            docker run -d \
              --name llamaops-ai-web \
              --network monitoring-network \
              -p 8501:8501 \
              --restart always \
              -e APP_USERNAME=${{ secrets.APP_USERNAME }} \
              -e APP_PASSWORD=${{ secrets.APP_PASSWORD }} \
              -e OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 \
              -e OTEL_SERVICE_NAME=llamaops-ai \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:latest

            #################################################
            # Verify Deployment
            #################################################

            docker ps

#################################################
# Build And Deploy Metrics Service
#################################################

  deploy-metrics:

    name: Build And Deploy Metrics Service

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.metrics == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login To Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #################################################
      # Build Metrics Image
      #################################################

      - name: Build Metrics Image

        run: |

          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.METRICS_IMAGE }}:latest \
            ./metrics

      #################################################
      # Push Metrics Image
      #################################################

      - name: Push Metrics Image

        run: |

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.METRICS_IMAGE }}:latest

      #################################################
      # Deploy Metrics Container
      #################################################

      - name: Deploy Metrics Container

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            docker network create monitoring-network || true

            docker pull \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.METRICS_IMAGE }}:latest

            docker stop metrics || true

            docker rm metrics || true

            docker run -d \
              --name metrics \
              --network monitoring-network \
              -p 5001:5001 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.METRICS_IMAGE }}:latest

            docker ps

#################################################
# Build And Deploy Grafana
#################################################

  deploy-grafana:

    name: Build And Deploy Grafana

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.grafana == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login To Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #################################################
      # Build Grafana Image
      #################################################

      - name: Build Grafana Image

        run: |

          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.GRAFANA_IMAGE }}:latest \
            ./grafana

      #################################################
      # Push Grafana Image
      #################################################

      - name: Push Grafana Image

        run: |

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.GRAFANA_IMAGE }}:latest

      #################################################
      # Deploy Grafana Container
      #################################################

      - name: Deploy Grafana Container

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            docker network create monitoring-network || true

            docker pull \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.GRAFANA_IMAGE }}:latest

            docker stop grafana || true

            docker rm grafana || true

            docker run -d \
              --name grafana \
              --network monitoring-network \
              -p 3000:3000 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.GRAFANA_IMAGE }}:latest

            docker ps

#################################################
# Build And Deploy Prometheus
#################################################

  deploy-prometheus:

    name: Build And Deploy Prometheus

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.prometheus == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login To Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #################################################
      # Build Prometheus Image
      #################################################

      - name: Build Prometheus Image

        run: |

          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.PROMETHEUS_IMAGE }}:latest \
            ./prometheus

      #################################################
      # Push Prometheus Image
      #################################################

      - name: Push Prometheus Image

        run: |

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.PROMETHEUS_IMAGE }}:latest

      #################################################
      # Deploy Prometheus Container
      #################################################

      - name: Deploy Prometheus Container

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            docker network create monitoring-network || true

            docker pull \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.PROMETHEUS_IMAGE }}:latest

            docker stop prometheus || true

            docker rm prometheus || true

            docker run -d \
              --name prometheus \
              --network monitoring-network \
              -p 9090:9090 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.PROMETHEUS_IMAGE }}:latest

            docker ps

#################################################
# Deploy Loki Log Backend
#################################################

  deploy-loki:

    name: Deploy Loki Log Backend

    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_observability == 'true'

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy Loki Container

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            docker network create monitoring-network || true

            docker stop loki || true

            docker rm loki || true

            #################################################
            # Copy Loki Config
            #################################################

            cat > /tmp/loki.yml << 'EOF'
            auth_enabled: false
            server:
              http_listen_port: 3100
              grpc_listen_port: 9096
            common:
              instance_addr: 127.0.0.1
              path_prefix: /var/loki
              storage:
                filesystem:
                  chunks_directory: /var/loki/chunks
                  rules_directory: /var/loki/rules
              replication_factor: 1
              ring:
                kvstore:
                  store: inmemory
            schema_config:
              configs:
                - from: 2024-01-01
                  store: tsdb
                  object_store: filesystem
                  schema: v13
                  index:
                    prefix: index_
                    period: 24h
            limits_config:
              allow_structured_metadata: true
              volume_enabled: true
            EOF

            docker run -d \
              --name loki \
              --network monitoring-network \
              -p 3100:3100 \
              --restart always \
              -v /tmp/loki.yml:/etc/loki.yml \
              -v loki-data:/var/loki \
              grafana/loki:latest \
              -config.file=/etc/loki.yml

            docker ps

#################################################
# Deploy Tempo Trace Backend
#################################################

  deploy-tempo:

    name: Deploy Tempo Trace Backend

    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_observability == 'true'

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy Tempo Container

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            docker network create monitoring-network || true

            docker stop tempo || true

            docker rm tempo || true

            #################################################
            # Copy Tempo Config
            #################################################

            cat > /tmp/tempo.yml << 'EOF'
            stream_over_http_enabled: true
            server:
              http_listen_port: 3200
            distributor:
              receivers:
                otlp:
                  protocols:
                    grpc:
                      endpoint: 0.0.0.0:4317
                    http:
                      endpoint: 0.0.0.0:4318
            ingester:
              max_block_duration: 5m
            compactor:
              compaction:
                block_retention: 1h
            storage:
              trace:
                backend: local
                local:
                  path: /var/tempo/blocks
                wal:
                  path: /var/tempo/wal
            EOF

            docker run -d \
              --name tempo \
              --network monitoring-network \
              -p 3200:3200 \
              -p 4319:4317 \
              --restart always \
              -v /tmp/tempo.yml:/etc/tempo.yml \
              -v tempo-data:/var/tempo \
              grafana/tempo:latest \
              -config.file=/etc/tempo.yml

            docker ps

#################################################
# Deploy OTel Collector
#################################################

  deploy-otel-collector:

    name: Deploy OTel Collector

    runs-on: ubuntu-latest

    needs:
      - deploy-tempo
      - deploy-loki

    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_observability == 'true'

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy OTel Collector

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            docker network create monitoring-network || true

            docker stop otel-collector || true

            docker rm otel-collector || true

            #################################################
            # Copy OTel Collector Config
            #################################################

            cat > /tmp/otel-collector-config.yml << 'EOF'
            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                  http:
                    endpoint: 0.0.0.0:4318
            processors:
              batch:
                timeout: 5s
                send_batch_size: 512
              resource:
                attributes:
                  - action: insert
                    key: service.name
                    value: llamaops-ai
            exporters:
              prometheus:
                endpoint: "0.0.0.0:8889"
                namespace: llamaops
              otlp/tempo:
                endpoint: tempo:4317
                tls:
                  insecure: true
              loki:
                endpoint: http://loki:3100/loki/api/v1/push
                default_labels_enabled:
                  exporter: false
                  job: true
                  instance: false
                  level: true
                tls:
                  insecure: true
              debug:
                verbosity: basic
            service:
              pipelines:
                traces:
                  receivers: [otlp]
                  processors: [batch]
                  exporters: [otlp/tempo, debug]
                metrics:
                  receivers: [otlp]
                  processors: [batch]
                  exporters: [prometheus]
                logs:
                  receivers: [otlp]
                  processors: [batch, resource]
                  exporters: [loki]
            EOF

            docker run -d \
              --name otel-collector \
              --network monitoring-network \
              -p 4317:4317 \
              -p 4318:4318 \
              -p 8889:8889 \
              --restart always \
              -v /tmp/otel-collector-config.yml:/etc/otel-collector-config.yml \
              otel/opentelemetry-collector-contrib:latest \
              --config=/etc/otel-collector-config.yml

            docker ps

#################################################
# Deploy Ollama AI Runtime
#################################################

  deploy-ollama:

    name: Deploy Ollama AI Runtime

    runs-on: ubuntu-latest

    needs:
      - deploy-frontend

    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_ollama == 'true'

    steps:

      #################################################
      # Deploy Ollama Container
      #################################################

      - name: Deploy Ollama Container

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            docker network create monitoring-network || true

            #################################################
            # Stop Existing Ollama
            #################################################

            docker stop ollama || true

            docker rm ollama || true

            #################################################
            # Deploy Ollama
            #################################################

            docker run -d \
              --name ollama \
              --network monitoring-network \
              -p 11434:11434 \
              --restart always \
              -e OLLAMA_NUM_PARALLEL=1 \
              -e OLLAMA_MAX_LOADED_MODELS=1 \
              -e OLLAMA_KEEP_ALIVE=24h \
              ollama/ollama:0.1.32

            #################################################
            # Wait For Startup
            #################################################

            sleep 30

            #################################################
            # Pull AI Model
            #################################################

            docker exec ollama ollama pull phi

            #################################################
            # Verify Ollama
            #################################################

            docker ps