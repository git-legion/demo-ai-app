name: llamaops-ai Pipeline

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      deploy_ollama:
        description: "Deploy Ollama Runtime"
        required: true
        default: "false"

#################################################
# Global Environment Variables
#################################################

env:
  AI_IMAGE: llamaops-ai-web
  METRICS_IMAGE: llamaops-ai-metrics
  GRAFANA_IMAGE: llamaops-ai-grafana-monitoring
  PROMETHEUS_IMAGE: llamaops-ai-prometheus-server

jobs:

#################################################
# Detect Changed Files
#################################################

  detect-changes:

    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      metrics: ${{ steps.filter.outputs.metrics }}
      grafana: ${{ steps.filter.outputs.grafana }}
      prometheus: ${{ steps.filter.outputs.prometheus }}
      workflow: ${{ steps.filter.outputs.workflow }}

    steps:

      #################################################
      # Checkout Repository
      #################################################

      - name: Checkout Source Code
        uses: actions/checkout@v4

      #################################################
      # Detect Changed Files
      #################################################

      - name: Detect Changed Files
        id: filter
        uses: dorny/paths-filter@v3

        with:
          filters: |

            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

            metrics:
              - 'metrics/**'
              - '.github/workflows/**'

            grafana:
              - 'grafana/**'
              - '.github/workflows/**'

            prometheus:
              - 'prometheus/**'
              - '.github/workflows/**'

            workflow:
              - '.github/workflows/**'

#################################################
# Build And Deploy Frontend AI Application
#################################################

  deploy-frontend:

    name: Build And Deploy AI Frontend

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    steps:

      #################################################
      # Checkout Source Code
      #################################################

      - name: Checkout Source Code
        uses: actions/checkout@v4

      #################################################
      # SonarQube Scan
      #################################################

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      #################################################
      # Docker Login
      #################################################

      - name: Login To Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #################################################
      # Build Frontend Image
      #################################################

      - name: Build Frontend Image

        run: |

          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:latest \
            ./frontend

      #################################################
      # Trivy Security Scan
      #################################################

      - name: Trivy Security Scan

        uses: aquasecurity/trivy-action@master

        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      #################################################
      # Push Frontend Image
      #################################################

      - name: Push Frontend Image

        run: |

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:latest

      #################################################
      # Deploy Frontend Container
      #################################################

      - name: Deploy Frontend Container

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            #################################################
            # Create Network
            #################################################

            docker network create monitoring-network || true

            #################################################
            # Pull Latest Frontend Image
            #################################################

            docker pull \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:latest

            #################################################
            # Stop Existing Frontend Container
            #################################################

            docker stop llamaops-ai-web || true

            docker rm llamaops-ai-web || true

            #################################################
            # Deploy Frontend Container
            #################################################

            docker run -d \
              --name llamaops-ai-web \
              --network monitoring-network \
              -p 8501:8501 \
              --restart always \
              -e APP_USERNAME=${{ secrets.APP_USERNAME }} \
              -e APP_PASSWORD=${{ secrets.APP_PASSWORD }} \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:latest

            #################################################
            # Verify Deployment
            #################################################

            docker ps

#################################################
# Build And Deploy Metrics Service
#################################################

  deploy-metrics:

    name: Build And Deploy Metrics Service

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.metrics == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login To Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #################################################
      # Build Metrics Image
      #################################################

      - name: Build Metrics Image

        run: |

          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.METRICS_IMAGE }}:latest \
            ./metrics

      #################################################
      # Push Metrics Image
      #################################################

      - name: Push Metrics Image

        run: |

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.METRICS_IMAGE }}:latest

      #################################################
      # Deploy Metrics Container
      #################################################

      - name: Deploy Metrics Container

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            docker network create monitoring-network || true

            docker pull \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.METRICS_IMAGE }}:latest

            docker stop metrics || true

            docker rm metrics || true

            docker run -d \
              --name metrics \
              --network monitoring-network \
              -p 5001:5001 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.METRICS_IMAGE }}:latest

            docker ps

#################################################
# Build And Deploy Grafana
#################################################

  deploy-grafana:

    name: Build And Deploy Grafana

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.grafana == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login To Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #################################################
      # Build Grafana Image
      #################################################

      - name: Build Grafana Image

        run: |

          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.GRAFANA_IMAGE }}:latest \
            ./grafana

      #################################################
      # Push Grafana Image
      #################################################

      - name: Push Grafana Image

        run: |

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.GRAFANA_IMAGE }}:latest

      #################################################
      # Deploy Grafana Container
      #################################################

      - name: Deploy Grafana Container

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            docker network create monitoring-network || true

            docker pull \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.GRAFANA_IMAGE }}:latest

            docker stop grafana || true

            docker rm grafana || true

            docker run -d \
              --name grafana \
              --network monitoring-network \
              -p 3000:3000 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.GRAFANA_IMAGE }}:latest

            docker ps

#################################################
# Build And Deploy Prometheus
#################################################

  deploy-prometheus:

    name: Build And Deploy Prometheus

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.prometheus == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login To Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #################################################
      # Build Prometheus Image
      #################################################

      - name: Build Prometheus Image

        run: |

          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.PROMETHEUS_IMAGE }}:latest \
            ./prometheus

      #################################################
      # Push Prometheus Image
      #################################################

      - name: Push Prometheus Image

        run: |

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.PROMETHEUS_IMAGE }}:latest

      #################################################
      # Deploy Prometheus Container
      #################################################

      - name: Deploy Prometheus Container

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            docker network create monitoring-network || true

            docker pull \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.PROMETHEUS_IMAGE }}:latest

            docker stop prometheus || true

            docker rm prometheus || true

            docker run -d \
              --name prometheus \
              --network monitoring-network \
              -p 9090:9090 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.PROMETHEUS_IMAGE }}:latest

            docker ps

#################################################
# Deploy Ollama AI Runtime
#################################################

  deploy-ollama:

    name: Deploy Ollama AI Runtime

    runs-on: ubuntu-latest

    needs:
      - deploy-frontend

    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_ollama == 'true'

    steps:

      #################################################
      # Deploy Ollama Container
      #################################################

      - name: Deploy Ollama Container

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            docker network create monitoring-network || true

            #################################################
            # Stop Existing Ollama
            #################################################

            docker stop ollama || true

            docker rm ollama || true

            #################################################
            # Deploy Ollama
            #################################################

            docker run -d \
              --name ollama \
              --network monitoring-network \
              -p 11434:11434 \
              --restart always \
              -e OLLAMA_NUM_PARALLEL=1 \
              -e OLLAMA_MAX_LOADED_MODELS=1 \
              -e OLLAMA_KEEP_ALIVE=24h \
              ollama/ollama:0.1.32

            #################################################
            # Wait For Startup
            #################################################

            sleep 30

            #################################################
            # Pull AI Model
            #################################################

            docker exec ollama ollama pull phi

            #################################################
            # Verify Ollama
            #################################################

            docker ps